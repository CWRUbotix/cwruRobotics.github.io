- name: Benjamin Mellick
  exec: true
  position: Treasurer
  email: brm92@case.edu
  imgurl: res/members/BenjaminMellick_Treasurer.png
  bio: "This is the story of a man named Benjamin. Benjamin studied at a university in the physics building where he was Engineering Physics major #12. Benjamin's job was simple: he studied physics at his desk in his room and played music in the campus symphony from time to time. When the time came and he was free, Benjamin would go to his dorm room where he would sit in front of a monitor and play games like Deep Rock Galactic. Benjamin relished every moment of his life, as though he had designed it precisely for himself. And Benjamin was happy."

